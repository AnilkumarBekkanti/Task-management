<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Task Management System</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="auth-container">
        <!-- Left Side - Welcome Section -->
        <div class="auth-left">
            <div class="welcome-content">
                <div class="decorative-elements">
                    <div class="circle circle-1"></div>
                    <div class="circle circle-2"></div>
                    <div class="circle circle-3"></div>
                    <div class="dots-pattern"></div>
                    <div class="dots-pattern dots-pattern-2"></div>
                    <div class="wave-pattern"></div>
                    <div class="gradient-orb orb-1"></div>
                    <div class="gradient-orb orb-2"></div>
                </div>
                <h1 class="welcome-title">Join us today!</h1>
                <p class="welcome-subtitle">Create your account and start managing your tasks efficiently</p>
            </div>
        </div>

        <!-- Right Side - Form Section -->
        <div class="auth-right">
            <div class="form-container">
                <h2 class="form-title">Create Account</h2>
                
                <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
                
                <form id="registerForm">
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-input" id="username" placeholder="Choose a username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-input" id="email" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-input" id="password" placeholder="Create a password" required>
                    </div>
                    
                    <button type="submit" class="btn-submit">Create Account</button>
                </form>
                
                <p class="form-footer">
                    Already have an account? <a href="login.html" class="link-primary">Sign in</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
