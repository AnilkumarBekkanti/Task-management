<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Task Management System</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="auth-container">
        <!-- Left Side - Welcome Section -->
        <div class="auth-left">
            <div class="welcome-content">
                <div class="decorative-elements">
                    <div class="circle circle-1"></div>
                    <div class="circle circle-2"></div>
                    <div class="circle circle-3"></div>
                    <div class="dots-pattern"></div>
                    <div class="dots-pattern dots-pattern-2"></div>
                    <div class="wave-pattern"></div>
                    <div class="gradient-orb orb-1"></div>
                    <div class="gradient-orb orb-2"></div>
                </div>
                <h1 class="welcome-title">Welcome back!</h1>
                <p class="welcome-subtitle">You can sign in to access with your existing account</p>
            </div>
        </div>

        <!-- Right Side - Form Section -->
        <div class="auth-right">
            <div class="form-container">
                <h2 class="form-title">Sign In</h2>
                
                <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username" class="form-label">Username or email</label>
                        <input type="text" class="form-input" id="username" placeholder="Enter your username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-input" id="password" placeholder="Enter your password" required>
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="btn-submit">Sign In</button>
                </form>
                
                <p class="form-footer">
                    Don't have an account? <a href="register.html" class="link-primary">Create an account</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
